<body>

<main class="container narrow center">

        <h1 th:text="${status} ?: 'Қате'">404</h1>
        <p th:if="${status == 404}">Сұралған бет немесе ресурс табылмады.</p>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>

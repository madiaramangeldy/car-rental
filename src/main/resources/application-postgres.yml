# Іске қосу: mvn spring-boot:run -Dspring-boot.run.profiles=postgres
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/autorent}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
  thymeleaf:
    cache: true

server:
  servlet:
    session:
      cookie:
        secure: true

spring:
  application:
    name: autorent
  datasource:
    # Әзірлеу ортасы: файлдық H2 (деректер ./data қалтасында сақталады)
    url: jdbc:h2:file:./data/autorent
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: true
    show-sql: false
  thymeleaf:
    cache: false
  servlet:
    multipart:
      # Сервис 5 МБ-тан үлкен фотоны түсінікті хабарламамен қабылдамайды
      max-file-size: 10MB
      max-request-size: 11MB

server:
  port: 8080
  error:
    # Пайдаланушыға stack trace және ішкі хабарламалар көрсетілмейді
    include-stacktrace: never
    include-message: never
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax

app:
  # Жүктелген фотолар сақталатын папка
  upload-dir: ./uploads
  seed:
    # Демо-аккаунттардың құпиясөздері. Өндірісте env айнымалылары арқылы беріледі
    admin-password: ${ADMIN_PASSWORD:Admin123!}
    manager-password: ${MANAGER_PASSWORD:Manager123!}
    client-password: ${CLIENT_PASSWORD:Client123!}

logging:
  level:
    kz.autorent: INFO
